# Static server for the Vite bundle. Not a proxy: /api never reaches this
# container. Traefik routes it straight to the API on the same hostname, by a
# rule longer than this app's, so it wins (deploy/compose.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Behind Traefik the port nginx knows about (8080) is not the one the
    # browser used. Relative redirects keep it out of Location headers.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Liveness for the Docker healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed filenames, so a given URL's bytes never change.
    # A missing asset is a 404, never index.html — the browser would otherwise
    # fail on "Unexpected token <" instead of on a clean 404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # BrowserRouter owns the URL space: /donors and /reports are real URLs a
    # browser requests directly on refresh. Anything that is not a file gets
    # the SPA shell.
    location / {
        try_files $uri /index.html;
    }

    # The only file whose URL is stable across deploys. A cached copy pins the
    # browser to the previous build's asset hashes, which no longer exist — a
    # blank page after a deploy, for exactly the people who used it before.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
